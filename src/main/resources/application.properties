spring.application.name=warehouse

# H2 file mode, so counts survive a restart. The brief allows an in-memory database, but
# leaving the URL unset makes Spring Boot pick jdbc:h2:mem: and every restart starts empty,
# which would fail the Data persistence deliverable.
spring.datasource.url=jdbc:h2:file:./data/warehouse
spring.datasource.driver-class-name=org.h2.Driver

# Hibernate drops all tables on shutdown when an embedded database has no explicit value,
# which for a file database means deleting the data the line above just wrote.
spring.jpa.hibernate.ddl-auto=update
